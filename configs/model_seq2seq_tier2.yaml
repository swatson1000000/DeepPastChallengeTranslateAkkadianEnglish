# TIER 2 Enhanced Configuration
# Includes: Copy mechanism, lexicon-constrained decoding, extended training

data:
  train: "data/processed/train_augmented.csv"  # Use augmented data (2,662 samples)
  test: "data/raw/test.csv"
  lexicon: "data/raw/OA_Lexicon_eBL.csv"

encoder:
  type: "lstm"
  num_layers: 2
  hidden_size: 512
  embedding_dim: 384
  dropout: 0.3
  bidirectional: false

attention:
  type: "bahdanau"
  hidden_dim: 512

# TIER 2: Copy mechanism configuration
copy_mechanism:
  enabled: true
  source_attention: "dot-product"
  coverage_enabled: true
  coverage_penalty: 0.1  # Prevent repeated copying of same source tokens
  copy_prob_threshold: 0.5  # When copy_prob > threshold, prefer copying

# TIER 2: Lexicon-constrained decoding
lexicon_constraints:
  enabled: true
  enforce_valid_tokens: true
  fallback_to_generation: true  # If no valid copy, generate from vocab

training:
  batch_size: 64  # Reduced from 128 to save ~50% GPU memory on tensor allocations
  max_epochs: 300  # Extended training with TIER 2
  learning_rate: 0.0005
  weight_decay: 1.0e-5
  gradient_accumulation_steps: 2  # Accumulate gradients over 2 steps to maintain effective batch size of 128
  early_stopping_patience: 50  # Longer patience for complex TIER 2 training
  
  # Learning rate scheduling
  scheduler:
    type: "cosine"
    T_max: 300
  
  # Plateau-aware reduction
  plateau_scheduler:
    enabled: true
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6

# Model checkpointing
checkpointing:
  save_best: true
  save_frequency: 10
  checkpoint_dir: "checkpoints"

# Decoding (inference) configuration
decoding:
  strategy: "greedy"  # or "beam_search"
  beam_width: 5
  length_penalty: 0.6
  max_seq_length: 256
  
  # Copy mechanism inference
  copy_enabled: true
  lexicon_constrained: true
  temperature: 0.8
  copy_threshold: 0.5

# Logging
logging:
  level: "INFO"
  save_to_file: true
  log_dir: "log"
  log_frequency: 100  # Log every N batches

# Hardware
device: "cuda"
mixed_precision: false  # Set to true for faster training if memory-constrained
