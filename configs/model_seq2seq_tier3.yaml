# TIER 3 Enhanced Configuration
# Includes: Beam search, subword tokenization prep, back-translation support

data:
  train: "data/processed/train_augmented.csv"
  synthetic: "data/synthetic_pairs.csv"  # From back-translation
  test: "data/raw/test.csv"
  lexicon: "data/raw/OA_Lexicon_eBL.csv"

encoder:
  type: "lstm"
  num_layers: 4
  hidden_size: 1024
  embedding_dim: 512
  dropout: 0.3
  bidirectional: false

attention:
  type: "bahdanau"
  hidden_dim: 1024

# TIER 2: Copy mechanism (inherited)
copy_mechanism:
  enabled: true
  source_attention: "dot-product"
  coverage_enabled: true
  coverage_penalty: 0.1

lexicon_constraints:
  enabled: true
  enforce_valid_tokens: true
  fallback_to_generation: true

# TIER 3: Beam Search
beam_search:
  enabled: true
  beam_width: 8
  length_penalty: 0.6
  coverage_penalty: 0.1
  min_length: 5

# TIER 3: Decoding improvements
decoding:
  method: "beam"  # or "greedy"
  temperature: 0.8
  top_k: 0  # 0 means no top-k filtering
  top_p: 0.9  # nucleus sampling parameter
  repetition_penalty: 1.2  # penalize repeated tokens

training:
  batch_size: 64
  max_epochs: 400
  learning_rate: 0.001
  weight_decay: 1.0e-4
  gradient_accumulation_steps: 2
  early_stopping_patience: 8  # Reduced — val loss plateaus by epoch ~28
  
  scheduler:
    type: "cosine"
    T_max: 400
  
  plateau_scheduler:
    enabled: true
    factor: 0.5
    patience: 5
    min_lr: 1e-7

# TIER 3: Data augmentation
augmentation:
  use_synthetic: true
  synthetic_weight: 0.3  # Weight of synthetic data in loss
  back_translation: true
  back_translation_confidence: 0.8  # Threshold for synthetic pairs

# TIER 3: Regularization
regularization:
  label_smoothing: 0.1
  embedding_dropout: 0.1
  decoder_dropout: 0.1
  dropout_variational: true  # Same dropout mask across timesteps
  scheduled_sampling: false  # Teacher forcing ratio decay

checkpointing:
  save_best: true
  save_frequency: 10  # Save every N epochs
  max_checkpoints: 5
