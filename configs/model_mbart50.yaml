# Configuration for mBART-50 fine-tuning
# Optimized for 75GB GPU memory

model:
  name: "mbart50"
  pretrained_model: "facebook/mbart-large-50"
  
  # Model parameters - GPU optimized
  max_length: 512
  num_beams: 8
  length_penalty: 0.5
  num_labels: 50
  
  # Fine-tuning specific
  freeze_encoder: false  # Whether to freeze encoder layers
  freeze_decoder: false  # Whether to freeze decoder layers
  num_freezing_steps: 0  # Steps before unfreezing
  
  device: "cuda"
  gradient_checkpointing: true  # Enabled for 75GB GPU to save memory

# Training configuration - GPU optimized
training:
  batch_size: 96  # Reduced batch size for 75GB GPU
  learning_rate: 2e-5
  weight_decay: 1e-4
  epochs: 25
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1  # No accumulation needed
  num_workers: 8
  pin_memory: true
  
  # Learning rate scheduling
  scheduler:
    type: "linear"
    warmup_steps: 1000
  
  # Mixed precision training (for faster training on modern GPUs)
  mixed_precision: "fp16"
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 3
    metric: "bleu"
    mode: "max"
  
  # Evaluation
  eval_steps: 500
  save_steps: 500
  seed: 42
  
  # Validation
  validation:
    split: 0.1
    evaluate_every: 500
    save_every: 1000
    num_beams: 5

# Data configuration
data:
  source_lang: "akkadian"
  target_lang: "english"
  source_file: "data/processed/train.akkadian"
  target_file: "data/processed/train.english"
  valid_source: "data/processed/valid.akkadian"
  valid_target: "data/processed/valid.english"
  test_file: "data/processed/test.akkadian"
  
  # Tokenization (uses mBART tokenizer)
  tokenization:
    type: "mbart"
    max_length: 100

# Inference configuration
inference:
  beam_width: 5
  length_penalty: 0.6
  temperature: 1.0
  max_length: 100
  min_length: 10
  num_beams: 5
  early_stopping: true

# Logging
logging:
  level: "INFO"
  save_logs: true
  log_dir: "results/training_logs"
  tb_dir: "results/tensorboard"

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  keep_best: true
  keep_last_n: 2
  save_optimizer: true
